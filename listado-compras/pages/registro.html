<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/style.css" />
    <title>Registro</title>
  </head>
  <body id="bodyRegistro">
    <header>
      <nav class="inicio">
        <a href="../pages/listacompras.html">Listado de Compras</a>
        <a href="../pages/elementos.html">Elementos</a>
        <a href="../pages/contacto.html">Contacto</a>
        <a href="../pages/iniciosesion.html">Inicio de Sesion</a>
        <a href="../pages/registro.html">Registro</a>
      </nav>
    </header>
    <div id="cabeceraRegistro"><h1 class="titulo">Registrese</h1></div>

    <section class="centrar">
      <form class="registro">
        <div class="col">
          <div>
            <div><label for="nombre">Nombres: *</label></div>
            <input type="text" id="nombre" placeholder="Tomas..." required />
            <div><label for="apellido">Apellido: *</label></div>
            <input
              type="text"
              id="apellido"
              placeholder="Gonzalez..."
              required
            />
          </div>

          <div>
            <div><label for="email">Email: *</label></div>
            <input
              type="email"
              id="email"
              placeholder="exmple@email.com"
              required
            />
          </div>
          <div>
            <div><label for="email2">Vuelva a ingresar el Email: *</label></div>
            <input
              type="email"
              id="email2"
              placeholder="exmple@email.com"
              required
            />
          </div>
        </div>

        <div class="col">
          <div>
            <div><label for="tel">Telefono: </label></div>
            <input type="tel" id="tel" />
          </div>

          <div>
            <div><label for="fechaNacimiento">Fecha de Nacimiento</label></div>
            <input type="date" name="Fecha" id="fechaNacimiento" />
          </div>
        </div>

        <div class="col">
          <div class="cuentanos">
            <fieldset>
              <legend>Cuentanos</legend>
              <div>
                <label for="opciones" class="aux">Como nos conociste</label>
              </div>
              <select id="opciones">
                <option value="0">Seleccione una opcion</option>
                <option value="1">Facebook</option>
                <option value="2">Instagram</option>
                <option value="3">Twitter</option>
              </select>
            </fieldset>
          </div>

          <div class="cuentanos">
            <div><label for="comentarios" class="aux">Comentarios: </label></div>
            <textarea
              id="comentarios"
              placeholder="ingrese algun comentario"
              cols="30"
              rows="5"
            ></textarea>
          </div>
        </div>

        <fieldset class="enlinea sinBorde">
          <legend>¿Tiene conocimientos de programacion?</legend>
          <div>
            <label for="progSi">Si</label>
            <input type="radio" id="progSi" name="grupo" value="si" />
          </div>
          <div>
            <label for="progNo">No</label>
            <input type="radio" id="progNo" name="grupo" value="no" />
          </div>
        </fieldset>

        <fieldset class="sinBorde">
          <legend>Seleccione los lenguajes de programacion que conoce</legend>
          <div class="enlinea">
            <label for="lenguajeJs">Javascript</label>
            <input type="checkbox" id="lenguajeJs" name="lenguajes" value="javascript" />
          </div>

          <div class="enlinea">
            <label for="lenguajeJava">Java</label>
            <input type="checkbox" id="lenguajeJava" name="lenguajes" value="java" />
          </div>

          <div class="enlinea">
            <label for="lenguajeCss">CSS</label>
            <input type="checkbox" id="lenguajeCss" name="lenguajes" value="css" />
          </div>

          <div class="enlinea">
            <label for="lenguajeTs">Typescript</label>
            <input type="checkbox" id="lenguajeTs" name="lenguajes" value="typescript" />
          </div>
        </fieldset>

        <button type="submit">Guardar</button>
      </form>
    </section>
    <footer><p>&copy;Derechos reservados</p></footer>
  </body>
</html>
