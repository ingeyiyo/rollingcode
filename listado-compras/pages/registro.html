  <head>
    <meta charset="UTF-8" />

    <!-- linea para el icono de la pestaña del navegador -->
    <link rel="shortcut icon" href="../assets/componentes-pasivos.png" type="image/png" />
    <!-- bootstrap por cdn, despues mis estilos para pisar lo que quiera cambiar -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <title>Registro · Lista de Electrónica</title>
  </head>

  <body>
    <header>
      <!-- navbar de bootstrap, en celular se convierte en el menu hamburguesa -->
      <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
          <a class="navbar-brand" href="../index.html">Lista de Electrónica</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Abrir menú">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
              <li class="nav-item"><a class="nav-link" href="listacompras.html">Lista de compras</a></li>
              <li class="nav-item"><a class="nav-link" href="elementos.html">Position</a></li>
              <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
              <li class="nav-item"><a class="nav-link" href="iniciosesion.html">Iniciar sesión</a></li>
              <li class="nav-item"><a class="nav-link active" aria-current="page" href="registro.html">Registro</a></li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <section class="titulo">
        <h1 class="display-6">Registro</h1>
        <p class="lead mb-0">Creá tu cuenta</p>
      </section>

      <section class="container py-5">
        <div class="row justify-content-center">
          <div class="col-12 col-lg-8">
            <!-- formulario con casi todos los tipos de input, en dos columnas en compu -->
            <form class="card">
              <div class="card-body">
                <div class="row g-3">
                  <div class="col-12 col-md-6">
                    <label for="nombre" class="form-label">Nombres *</label>
                    <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Tomás" required />
                  </div>
                  <div class="col-12 col-md-6">
                    <label for="apellido" class="form-label">Apellido *</label>
                    <input type="text" class="form-control" id="apellido" name="apellido" placeholder="González" required />
                  </div>
                  <div class="col-12 col-md-6">
                    <label for="email" class="form-label">Email *</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="ejemplo@email.com" required />
                  </div>
                  <div class="col-12 col-md-6">
                    <label for="email2" class="form-label">Repetí el email *</label>
                    <input type="email" class="form-control" id="email2" name="email2" placeholder="ejemplo@email.com" required />
                  </div>
                  <div class="col-12 col-md-6">
                    <label for="tel" class="form-label">Teléfono</label>
                    <input type="tel" class="form-control" id="tel" name="tel" />
                  </div>
                  <div class="col-12 col-md-6">
                    <label for="fechaNacimiento" class="form-label">Fecha de nacimiento</label>
                    <input type="date" class="form-control" id="fechaNacimiento" name="fecha" />
                  </div>
                  <div class="col-12">
                    <label for="opciones" class="form-label">¿Cómo nos conociste?</label>
                    <select class="form-select" id="opciones" name="opciones">
                      <option value="">Elegí una opción</option>
                      <option value="facebook">Facebook</option>
                      <option value="instagram">Instagram</option>
                      <option value="twitter">Twitter</option>
                    </select>
                  </div>
                  <div class="col-12">
                    <label for="comentarios" class="form-label">Comentarios</label>
                    <textarea class="form-control" id="comentarios" name="comentarios" rows="4" placeholder="Escribí algún comentario"></textarea>
                  </div>

                  <fieldset class="col-12 col-md-6">
                    <legend class="fs-6">¿Tenés conocimientos de programación?</legend>
                    <div class="form-check form-check-inline">
                      <input class="form-check-input" type="radio" id="progSi" name="programacion" value="si" />
                      <label class="form-check-label" for="progSi">Sí</label>
                    </div>
                    <div class="form-check form-check-inline">
                      <input class="form-check-input" type="radio" id="progNo" name="programacion" value="no" />
                      <label class="form-check-label" for="progNo">No</label>
                    </div>
                  </fieldset>

                  <fieldset class="col-12 col-md-6">
                    <legend class="fs-6">¿Qué lenguajes conocés?</legend>
                    <div class="form-check form-check-inline">
                      <input class="form-check-input" type="checkbox" id="lenguajeJs" name="lenguajes" value="javascript" />
                      <label class="form-check-label" for="lenguajeJs">JavaScript</label>
                    </div>
                    <div class="form-check form-check-inline">
                      <input class="form-check-input" type="checkbox" id="lenguajeJava" name="lenguajes" value="java" />
                      <label class="form-check-label" for="lenguajeJava">Java</label>
                    </div>
                    <div class="form-check form-check-inline">
                      <input class="form-check-input" type="checkbox" id="lenguajeCss" name="lenguajes" value="css" />
                      <label class="form-check-label" for="lenguajeCss">CSS</label>
                    </div>
                    <div class="form-check form-check-inline">
                      <input class="form-check-input" type="checkbox" id="lenguajeTs" name="lenguajes" value="typescript" />
                      <label class="form-check-label" for="lenguajeTs">TypeScript</label>
                    </div>
                  </fieldset>

                  <div class="col-12">
                    <button type="submit" class="btn btn-dark w-100">Guardar</button>
                  </div>
                </div>
              </div>
            </form>
          </div>
        </div>
      </section>

    </main>

    <footer class="text-center py-3 mt-5">
      <p class="mb-0">Juan Pablo Rearte · Laboratorio de Electrónica 1</p>
    </footer>

    <!-- js de bootstrap, lo necesito para que abra el menu hamburguesa -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
