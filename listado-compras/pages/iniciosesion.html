<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- linea para descripcion del buscador -->
    <meta name="description" content="Lista de materiales para el TP de Laboratorio de Electrónica 1." />
    <!-- linea para palabras claves del buscador -->
    <meta name="keywords" content="electronica, componentes, laboratorio" />
    <!-- linea para el icono de la pestaña del navegador -->
    <link rel="shortcut icon" href="../assets/componentes-pasivos.png" type="image/png" />
    <!-- bootstrap por cdn, despues mis estilos para pisar lo que quiera cambiar -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <title>Iniciar sesión · Lista de Electrónica</title>
  </head>

  <body>
    <header>
      <!-- navbar de bootstrap, en celular se convierte en el menu hamburguesa -->
      <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
          <a class="navbar-brand" href="../index.html">Lista de Electrónica</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Abrir menú">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
              <li class="nav-item"><a class="nav-link" href="listacompras.html">Lista de compras</a></li>
              <li class="nav-item"><a class="nav-link" href="elementos.html">Position</a></li>
              <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
              <li class="nav-item"><a class="nav-link active" aria-current="page" href="iniciosesion.html">Iniciar sesión</a></li>
              <li class="nav-item"><a class="nav-link" href="registro.html">Registro</a></li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <section class="titulo">
        <h1 class="display-6">Iniciar sesión</h1>
        <p class="lead mb-0">Entrá con tu email</p>
      </section>

      <section class="container py-5">
        <div class="row justify-content-center">
          <div class="col-12 col-sm-8 col-md-6 col-lg-4">
            <!-- formulario chico centrado en una tarjeta -->
            <form class="card">
              <div class="card-body">
                <div class="mb-3">
                  <label for="email" class="form-label">Email *</label>
                  <input type="email" class="form-control" id="email" name="email" placeholder="ejemplo@email.com" required />
                </div>
                <div class="mb-3">
                  <label for="contrasena" class="form-label">Contraseña *</label>
                  <input type="password" class="form-control" id="contrasena" name="contrasena" minlength="6" required />
                </div>
                <button type="submit" class="btn btn-dark w-100">Entrar</button>
                <p class="text-center mt-3 mb-0">¿No tenés cuenta? <a href="registro.html">Registrate</a></p>
              </div>
            </form>
          </div>
        </div>
      </section>

    </main>

    <footer class="text-center py-3 mt-5">
      <p class="mb-0">Juan Pablo Rearte · Laboratorio de Electrónica 1</p>
    </footer>

    <!-- js de bootstrap, lo necesito para que abra el menu hamburguesa -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
