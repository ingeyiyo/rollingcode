<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="img/valorant.jpg" type="image/jpeg" />
    <!-- bootstrap por cdn, despues mis estilos para pisar lo que quiera cambiar -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Valorant · Iniciar sesión</title>
  </head>

  <body>
    <header>
      <!-- navbar de bootstrap, en celular se convierte en el menu hamburguesa -->
      <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
          <a class="navbar-brand" href="index.html">Valorant</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Abrir menú">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
              <li class="nav-item"><a class="nav-link" href="skins.html">Mejores skins</a></li>
              <li class="nav-item"><a class="nav-link" href="registro.html">Registrarse</a></li>
              <li class="nav-item"><a class="nav-link active" aria-current="page" href="iniciosesion.html">Iniciar sesión</a></li>
              <li class="nav-item"><a class="nav-link" href="position.html">Position</a></li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <section class="encabezado">
        <h1 class="display-5">Iniciar sesión</h1>
        <p class="lead mb-0">Entrá con tu usuario</p>
      </section>

      <section class="container py-5">
        <div class="row justify-content-center">
          <div class="col-12 col-sm-8 col-md-6 col-lg-4">
            <!-- formulario chico centrado en una tarjeta -->
            <form class="card">
              <div class="card-body">
                <div class="mb-3">
                  <label for="usuario" class="form-label">Usuario</label>
                  <input type="text" class="form-control" id="usuario" name="usuario" minlength="4" maxlength="15" placeholder="pepito123" required />
                </div>
                <div class="mb-3">
                  <label for="contrasena" class="form-label">Contraseña</label>
                  <input type="password" class="form-control" id="contrasena" name="contrasena" minlength="4" maxlength="15" required />
                </div>
                <div class="form-check mb-3">
                  <input class="form-check-input" type="checkbox" id="recordarme" name="recordarme" />
                  <label class="form-check-label" for="recordarme">Recordarme</label>
                </div>
                <button type="submit" class="btn btn-valorant w-100">Entrar</button>
                <p class="text-center mt-3 mb-0">¿No tenés cuenta? <a href="registro.html" class="link-light">Registrate</a></p>
              </div>
            </form>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer text-center py-3">
      <p class="mb-0">&copy; Juan Pablo Rearte (Yiyo). Página de práctica, no tiene nada que ver con Riot Games.</p>
    </footer>

    <!-- js de bootstrap, lo necesito para que abra el menu hamburguesa -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
