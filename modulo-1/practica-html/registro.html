        <section>
            <h2>Registro</h2>
            <form>
                <div>
                    <label for="usuario">Usuario: </label>
                    <input type="text" id="usuario" name="usuario" maxlength="15" minlength="4" placeholder="pepito123" required>
                </div>
                <div>
                    <!-- <label>ejemplo</label>
                    <input type="number"> -->
                    <label for="contrasena">Contraseña: </label>
                    <input type="password" id="contrasena" name="contrasena" maxlength="15" minlength="4" required>
                </div>
                <div>
                    <label for="correo">Correo Electronico: </label>
                    <input type="email" id="correo" name="correo" placeholder="ejemplo@email.com" required>
                </div>
                <!-- <div>
                    <label>Comentarios: </label>
                    <textarea placeholder="ingrese algun comentario" cols="30" rows="5"></textarea>
                </div>
                <div>

                        <option></option>
                        <option value="">hola</option>

                        <option>tumama flori</option>
                    </select>
                </div> -->
                <p>¿Tiene conocimientos previos de programación?</p>
                <div>
                    <input type="radio" id="progSi" name="grupo" value="si">
                    <label for="progSi">Si</label>
                    <input type="radio" id="progNo" name="grupo" value="no">
                    <label for="progNo">No</label>
                </div>
                <p>¿Quiere suscribirse a nuestro newsletter?</p>
                <div>
                    <input type="checkbox" id="newsDiario" name="newsletter" value="diario">
                    <label for="newsDiario">Newsletter diario</label>
                    <input type="checkbox" id="newsSemanal" name="newsletter" value="semanal">
                    <label for="newsSemanal">Newsletter semanal</label>
                </div>
                
                <button type="submit">Enviar</button>
            </form>
